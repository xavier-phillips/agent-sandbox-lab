name: Deterministic CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-ci:
    name: Deterministic CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run fixture, guard, review-evidence and publication-race tests
        run: node --test fixture/math.test.js scripts/acceptance.test.cjs scripts/guard.test.cjs scripts/review-evidence.test.cjs scripts/publication-race.test.cjs
