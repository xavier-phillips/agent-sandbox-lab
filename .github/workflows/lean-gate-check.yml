name: Native Actions review gate acceptance
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Synthetic gate-acceptance PR number
        required: true
        type: number
      expected_head:
        description: Exact synthetic PR head SHA
        required: true
        type: string
permissions: {}
jobs:
  approve-synthetic-head:
    if: github.actor_id == '141337987' && github.repository_id == '1441786552'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {pr_number, expected_head} = context.payload.inputs;
            const number = Number(pr_number);
            if (!Number.isSafeInteger(number) || number < 1 || !/^[a-f0-9]{40}$/.test(expected_head)) throw Error('Invalid inputs');
            const {owner, repo} = context.repo;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft !== false || pr.head.repo?.full_name !== `${owner}/${repo}` || pr.base.repo?.full_name !== `${owner}/${repo}` || pr.base.ref !== 'gate-acceptance' || pr.user.id !== 141337987 || !pr.title.startsWith('[gate acceptance] ') || pr.head.sha !== expected_head) throw Error('Outside synthetic gate acceptance');
            await github.rest.pulls.createReview({owner, repo, pull_number: number, commit_id: expected_head, event: 'APPROVE', body: '[acceptance only] Native Actions reviewer identity probe; no model or semantic verdict'});
